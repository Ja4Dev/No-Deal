allprojects {
    version = '1.0'
    ext {
        appName = "NoDeal"
        gdxVersion = '1.13.1'
        ashleyVersion = '1.7.4'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
}

// Android has its own plugin (and Java settings): everything else is a plain Java project.
configure(subprojects.findAll { it.name != 'android' }) {
    apply plugin: "eclipse"
    apply plugin: "java-library"

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

project(":core") {
    // The game itself stays Java 8 (language and library) because iOS (MobiVM) runs Java 8 bytecode.
    // Android, desktop and the server use it from Java 17 code.
    tasks.named('compileJava') {
        options.release = 8
    }
    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
        api "com.badlogicgames.ashley:ashley:$ashleyVersion"
    }
}

project(":desktop") {
    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"
    }
}

project(":server") {
    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"
    }
}

// Windows launcher (NoDeal.exe) and package: packageWindows, zipWindows.
apply from: "launcher/launcher.gradle"
