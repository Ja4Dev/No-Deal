import org.gradle.internal.os.OperatingSystem

sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.main.resources.srcDirs = [ "../core/assets" ]

def mainClassName = "com.juego.core.desktop.DesktopLauncher"
def assetsDir = file("../core/assets")
// LWJGL3 on macOS requires the GLFW event loop to run on the first thread.
def macJvmArgs = OperatingSystem.current().isMacOsX() ? ["-XstartOnFirstThread"] : []

tasks.register("run", JavaExec) {
    group = "application"
    description = "Runs the desktop game."
    dependsOn classes
    mainClass = mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = assetsDir
    jvmArgs = macJvmArgs
    standardInput = System.in
    ignoreExitValue = true
}

tasks.register("debug", JavaExec) {
    group = "application"
    description = "Runs the desktop game with a debugger attached on port 5005."
    dependsOn classes
    mainClass = mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = assetsDir
    jvmArgs = macJvmArgs
    standardInput = System.in
    ignoreExitValue = true
    debug = true
}

tasks.register("dist", Jar) {
    group = "build"
    description = "Builds a runnable fat jar into desktop/build/libs."
    archiveBaseName = appName
    archiveVersion = project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': mainClassName
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    with jar
}

eclipse.project.name = appName + "-desktop"
