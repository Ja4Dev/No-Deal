// Windows launcher (NoDeal.exe) and the Windows package. Applied from the root build.gradle.
//
//   ./gradlew launcherExe       compiles build/launcher/NoDeal.exe
//   ./gradlew packageWindows    builds build/windows/NoDeal/ (exe + game jars + a trimmed Java runtime)
//   ./gradlew zipWindows        zips it into build/distributions/NoDeal-<version>-windows.zip
//
// Add -PwithoutJava to leave the runtime out (the launcher then uses the Java installed on the PC, or
// tells the player what to install). Building needs Windows: the launcher is compiled with the C#
// compiler that comes with the .NET Framework, and jlink builds a runtime for the OS it runs on.

import org.gradle.internal.os.OperatingSystem

def launcherSrc = file('launcher')
def launcherOut = layout.buildDirectory.dir('launcher')
def windowsOut = layout.buildDirectory.dir('windows')
def bundleJava = !project.hasProperty('withoutJava')

// What the game and the dedicated server use (jdeps), plus jdk.crypto.ec for the server's HTTPS
// public IP lookup. Checked with the client and the server running on the trimmed runtime.
def runtimeModules = 'java.base,java.desktop,java.net.http,java.prefs,jdk.unsupported,jdk.crypto.ec'

def requireWindows = { String what ->
    if (!OperatingSystem.current().isWindows())
        throw new GradleException("$what needs Windows.")
}

def findCsc = {
    def windir = System.getenv('WINDIR') ?: 'C:\\Windows'
    def csc = ['Framework64', 'Framework']
            .collect { new File(windir, "Microsoft.NET/$it/v4.0.30319/csc.exe") }
            .find { it.exists() }
    if (csc == null)
        throw new GradleException('C# compiler not found: the launcher needs the .NET Framework 4.x that comes with Windows.')
    return csc.absolutePath
}

tasks.register('launcherBuildInfo') {
    def out = launcherOut.map { it.file('BuildInfo.cs') }
    def appVersion = version.toString()
    inputs.property('version', appVersion)
    outputs.file(out)
    doLast {
        // AssemblyFileVersion wants four numbers: "1.0" -> "1.0.0.0".
        def numbers = (appVersion.findAll(/\d+/) + ['0', '0', '0', '0']).take(4).join('.')
        out.get().asFile.text = """\
            // Generated by launcher.gradle.
            using System.Reflection;

            [assembly: AssemblyTitle("No Deal")]
            [assembly: AssemblyProduct("No Deal")]
            [assembly: AssemblyDescription("No Deal launcher")]
            [assembly: AssemblyVersion("$numbers")]
            [assembly: AssemblyFileVersion("$numbers")]
            [assembly: AssemblyInformationalVersion("$appVersion")]

            namespace NoDeal.Launcher
            {
                static class BuildInfo
                {
                    public const string Version = "$appVersion";
                }
            }
            """.stripIndent()
    }
}

tasks.register('launcherExe', Exec) {
    group = 'build'
    description = 'Compiles the Windows launcher, build/launcher/NoDeal.exe.'
    dependsOn 'launcherBuildInfo'
    def sources = fileTree(new File(launcherSrc, 'src')) { include '**/*.cs' }
    def buildInfo = launcherOut.map { it.file('BuildInfo.cs') }
    def icon = new File(launcherSrc, 'NoDeal.ico')
    def manifest = new File(launcherSrc, 'app.manifest')
    def titleImage = file('core/assets/mainMenu/title.png')
    def backgroundImage = file('core/assets/mainMenu/background.png')
    def exe = launcherOut.map { it.file('NoDeal.exe') }
    inputs.files(sources, buildInfo, icon, manifest, titleImage, backgroundImage)
    outputs.file(exe)
    doFirst {
        requireWindows('Compiling the launcher')
        executable = findCsc()
        args = ['/nologo', '/target:winexe', '/optimize+', '/platform:anycpu', '/codepage:65001',
                '/warnaserror+',
                "/out:${exe.get().asFile}",
                "/win32icon:$icon",
                "/win32manifest:$manifest",
                '/r:System.dll', '/r:System.Drawing.dll', '/r:System.Windows.Forms.dll',
                "/resource:$titleImage,NoDeal.title.png",
                "/resource:$backgroundImage,NoDeal.background.png",
                buildInfo.get().asFile.path] + sources.files*.path.sort()
    }
}

tasks.register('windowsRuntime', Exec) {
    group = 'build'
    description = 'Builds the trimmed Java runtime that goes with the Windows package (jlink).'
    def out = windowsOut.map { it.dir('runtime') }
    def javaHome = System.getProperty('java.home')
    inputs.property('modules', runtimeModules)
    inputs.property('javaHome', javaHome)
    outputs.dir(out)
    doFirst {
        requireWindows('Building the Windows runtime')
        def jlink = new File(javaHome, 'bin/jlink.exe')
        if (!jlink.exists())
            throw new GradleException("jlink not found in $javaHome: run Gradle with a JDK (not a JRE), version 17 or newer.")
        project.delete(out) // jlink refuses to write into an existing folder
        executable = jlink.path
        args = ['--add-modules', runtimeModules, '--strip-debug', '--no-header-files', '--no-man-pages',
                '--compress=2', '--output', out.get().asFile.path]
    }
}

tasks.register('packageWindows', Sync) {
    group = 'distribution'
    description = 'Builds the Windows package in build/windows/NoDeal (-PwithoutJava to leave Java out).'
    dependsOn ':desktop:dist', ':server:dist'
    into windowsOut.map { it.dir('NoDeal') }
    from(tasks.named('launcherExe'))
    into('game') {
        from(project(':desktop').layout.buildDirectory.file("libs/${appName}-${version}.jar")) {
            rename { 'NoDeal.jar' }
        }
        from(project(':server').layout.buildDirectory.file("libs/${appName}-server-${version}.jar")) {
            rename { 'NoDeal-server.jar' }
        }
    }
    if (bundleJava)
        into('runtime') { from(tasks.named('windowsRuntime')) }
}

tasks.register('zipWindows', Zip) {
    group = 'distribution'
    description = 'Zips the Windows package into build/distributions.'
    from(tasks.named('packageWindows')) { into 'NoDeal' }
    destinationDirectory = layout.buildDirectory.dir('distributions')
    archiveFileName = "NoDeal-${version}-windows${bundleJava ? '' : '-sin-java'}.zip"
}
